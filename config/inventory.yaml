language: yongning-na
#title: Yongning-na Transcription Character Inventory
data_roots:
  - ~/projects/my-projects/asr-models/language-downloads/yongning-na_01/doreco_yong1270_core_v2.0/
report_dir: ../reports/yongning-na
report_name: "{language}_data_inventory.md"
transcription_globs:
#   - "*.txt"
   - "*.eaf"
#   - "*.TextGrid"
#   - "*.csv"
csv_text_column: form
textgrid_tier: segments
eaf_tier: W-0
example_limit: 3
context_chars: 24
