language: yonghe_qiang_12
title: Yonghe Qiang Transcription Character Inventory
data_roots:
  - ~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/
report_dir: ../reports/yonghe_qiang
report_name: "{language}_data_inventory.md"
transcription_globs:
#   - "*.txt"
   - "*.eaf"
#   - "*.TextGrid"
#   - "*.csv"
csv_text_column: form
textgrid_tier: segments
eaf_tier: all
example_limit: 3
context_chars: 24
chao_number_regex: "[1-5]{2,}"
chao_letters:
  - "˥"
  - "˦"
  - "˧"
  - "˨"
  - "˩"
  - "꜒"
  - "꜓"
  - "꜔"
  - "꜕"
  - "꜖"
diacritic_markers:
  - "◌̀"
  - "◌́"
  - "◌̂"
  - "◌̃"
  - "◌̄"
  - "◌̆"
  - "◌̈"
  - "◌̊"
  - "◌̌"
  - "◌̩"
  - "◌̯"
